  - 'Technical leader with 12+ years of R&amp;D and engineering experience, including 6+ years of team leadership, now focused on XR optics, human visual perception, and applied AI. Built Instrument Systems’ Shanghai XR optical laboratory and engineering team, and now lead XR R&amp;D in China: defining near-eye display measurement methods, translating them into production tests, and contributing to international standards development. Led technical engagements with 20+ device makers and display manufacturers, including Apple, Samsung, and BOE. Lead author of the <em>XR Optical Testing Handbook</em>, with 20+ peer-reviewed papers and 7+ invited XR talks.'
